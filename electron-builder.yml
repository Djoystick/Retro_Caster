appId: com.djoystick.retrocaster
productName: RetroCaster
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/yt-dlp-exec/bin/**
  - node_modules/@ffmpeg-installer/**
  - node_modules/@ffprobe-installer/**
win:
  executableName: RetroCaster
  target:
    - target: nsis
    - target: portable
portable:
  artifactName: RetroCaster-Portable-v${version}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: RetroCaster-Installer-v${version}.exe
  shortcutName: RetroCaster
  uninstallDisplayName: RetroCaster
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: retrocaster-app-${version}.dmg
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: retrocaster-app-${version}.AppImage
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
